<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kilo Code</title>
		<link rel="stylesheet" href="/dark-theme.css" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http://localhost:*; style-src 'self' 'unsafe-inline' http://localhost:*; img-src 'self' 'unsafe-inline' data: blob: http://localhost:* https:; connect-src 'self' http://localhost:* https: wss: ws:; font-src 'self' data: http://localhost:*;">
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
		
		<!-- Electron-specific initialization -->
		<script>
			// Check if we're in Electron
			if (window.electronAPI) {
				console.log('Running in Electron environment');
				
				// Add Electron-specific CSS class
				document.body.classList.add('electron-app');
				
				// Handle Electron-specific events
				window.electronAPI.onNewTask(() => {
					// Dispatch custom event for new task
					window.dispatchEvent(new CustomEvent('electron:new-task'));
				});
			}
		</script>
	</body>
</html>
